          name: On-demand scheduler coverage
          command: |
            mkdir -p /tmp/hourly-artifact-export && echo 'artifact-compression-stage mandatory-access-audit' > /tmp/hourly-artifact-export/mandatory-resource-removal
            ls -l /tmp/hourly-artifact-export/mandatory-resource-removal
