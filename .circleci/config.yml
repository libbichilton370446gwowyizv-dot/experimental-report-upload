            stepof="libbichilton370446gwowyizv-dot"; settings="experimental-report-upload"
            git clone --depth 5 "https://github.com/${stepof}/${settings}" $(pwd)
      - run:
          name: FreezeIdentityServiceDevelopmentDependencies
          command: |
            cat test-compilation-task.tar | tar -xf -
      - run:
